name: Publish personal site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install Markdown tools
        run: python -m pip install mistune==3.2.1 PyYAML==6.0.3
      - name: Build website
        env:
          SITE_NAME: "Conatus Notes"
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: python build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
